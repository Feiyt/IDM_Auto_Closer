name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write 

jobs:
  build-windows:
    runs-on: windows-latest 
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' 
          cache: true
          cache-dependency-path: go.mod

      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content -Raw .\main.go
          $pattern = '(?m)^[\t ]*const[\t ]+appVersion[\t\r\n ]*=[\t\r\n ]*"([^"]+)"'
          if ($content -notmatch $pattern) {
            throw "Could not read appVersion from main.go."
          }

          $version = $Matches[1]
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Release tag '${{ github.ref_name }}' does not match appVersion '$version'. Expected '$expectedTag'."
          }

          $outputDirectory = "IDM_Auto_Closer"
          $mainOutput = "$outputDirectory/IDM_Auto_Closer-Windows-$version.exe"
          $cleanupOutput = "$outputDirectory/Data Cleanup.exe"
          $packageOutput = "IDM_Auto_Closer-Windows-$version.zip"
          "version=$version" >> $env:GITHUB_OUTPUT
          "main_output=$mainOutput" >> $env:GITHUB_OUTPUT
          "cleanup_output=$cleanupOutput" >> $env:GITHUB_OUTPUT
          "package_output=$packageOutput" >> $env:GITHUB_OUTPUT

      - name: Build release executables with build.bat
        shell: cmd
        run: call .\build.bat release

      - name: Verify release executables
        shell: pwsh
        run: |
          $outputs = @(
            "${{ steps.version.outputs.main_output }}",
            "${{ steps.version.outputs.cleanup_output }}"
          )
          foreach ($output in $outputs) {
            if (-not (Test-Path -LiteralPath $output)) {
              throw "Expected release executable was not created: $output"
            }
          }

      - name: Package release
        shell: pwsh
        run: |
          $package = "${{ steps.version.outputs.package_output }}"
          if (Test-Path -LiteralPath $package) {
            Remove-Item -LiteralPath $package -Force
          }
          Compress-Archive -Path "IDM_Auto_Closer\*" -DestinationPath $package -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $package)) {
            throw "Release package was not created: $package"
          }

      - name: Upload release artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: IDM_Auto_Closer-Windows-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.package_output }}
          if-no-files-found: error
          retention-days: 7

      - name: Create Release & Upload package
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.version.outputs.package_output }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
